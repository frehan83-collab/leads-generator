[project]
name = "sperton-leads-generator"
version = "2.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
exclude = ["invoice_ocr", ".venv", "manual"]

[tool.ruff.lint]
# Enforced in CI. Deliberately excluded for now (resilient-scraper patterns):
# BLE (blind-except is the per-card/per-page recovery strategy),
# S/SIM/G (style opinions), RUF/DTZ/PERF/PIE/PLE (future cleanup).
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

{# Rows-per-page selector. Expects `per_page` in context. Preserves all
   other query params and resets to page 1 on change. #}
<label class="flex items-center gap-2 text-[11px] text-slate-500">
    Show
    <select onchange="const u = new URL(window.location); u.searchParams.set('per_page', this.value); u.searchParams.set('page', '1'); window.location = u;"
        class="input !py-1.5 !px-2 !text-[11px]">
        {% for n in [25, 50, 100, 200] %}
        <option value="{{ n }}" {% if per_page == n %}selected{% endif %}>{{ n }}</option>
        {% endfor %}
    </select>
    / page
</label>

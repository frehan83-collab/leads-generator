{% extends "base.html" %}
{% block title %}Something went wrong{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto text-center py-16 animate-card">
    <div class="font-mono text-6xl font-bold text-gradient mb-4">500</div>
    <h1 class="text-xl font-semibold text-slate-200 mb-2">Something went wrong</h1>
    <p class="text-sm text-slate-500 mb-8">An unexpected error occurred. The details were logged — try again, or check <code class="font-mono text-slate-400">logs/leads_generator.log</code>.</p>
    <div class="flex gap-3 justify-center">
        <a href="/" class="btn-primary">Back to Dashboard</a>
        <a href="/settings" class="btn-secondary">Settings</a>
    </div>
</div>
{% endblock %}
